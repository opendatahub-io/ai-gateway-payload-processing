upstreamIpp:
  payloadProcessor:
    image:
      tag: latest
    customConfig:
      plugins:
      - type: maas-headers-guard
        parameters:
          # Single chain: model-extractor and model-provider-resolver below
          # set these headers again, so values from the wire are dropped.
          stripRoutingHeaders: true
      - type: body-field-to-header
        name: model-extractor
        parameters:
          fieldName: model
          headerName: X-Gateway-Model-Name
      - type: model-provider-resolver
      - type: api-translation
      - type: apikey-injection
      profiles:
      - name: default
        plugins:
          request:
          - pluginRef: maas-headers-guard
          - pluginRef: model-extractor
          - pluginRef: model-provider-resolver
          - pluginRef: api-translation
          - pluginRef: apikey-injection
          response:
          - pluginRef: api-translation
  provider:
    name: istio
    istio:
      envoyFilter:
        operation: INSERT_FIRST
